<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category 3: Reading Prose & Poetry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>.tab-active { border-bottom: 3px solid #7c3aed; color: #7c3aed; font-weight: bold; }</style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">
    <header class="bg-purple-700 text-white p-6 shadow-lg">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <span class="bg-purple-900 text-purple-200 text-xs font-semibold px-2.5 py-1 rounded-full uppercase">Category 3 Review</span>
                <h1 class="text-2xl font-bold mt-1">Reading Prose & Poetry</h1>
            </div>
            <div class="bg-purple-800 px-4 py-2 rounded-lg border border-purple-600 text-center">
                <p class="text-xs text-purple-200 uppercase font-semibold">Mastery Score</p>
                <p id="score-display" class="text-2xl font-black text-yellow-300">0 / 4</p>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 md:p-6 space-y-6">
        <div class="flex overflow-x-auto bg-white rounded-xl shadow-sm border p-2 gap-2">
            <button onclick="switchStandard(0)" id="tab-0" class="tab-btn tab-active px-4 py-2 rounded-lg text-sm whitespace-nowrap">ELA.6.R.1.1 (Character & Plot)</button>
            <button onclick="switchStandard(1)" id="tab-1" class="tab-btn px-4 py-2 rounded-lg text-sm whitespace-nowrap">ELA.6.R.1.2 (Theme Development)</button>
            <button onclick="switchStandard(2)" id="tab-2" class="tab-btn px-4 py-2 rounded-lg text-sm whitespace-nowrap">ELA.6.R.1.3 (Point of View)</button>
            <button onclick="switchStandard(3)" id="tab-3" class="tab-btn px-4 py-2 rounded-lg text-sm whitespace-nowrap">ELA.6.R.1.4 (Poetic Structure)</button>
        </div>

        <!-- BENCHMARK TUTORIAL & ANCHOR CHART AT TOP -->
        <div class="bg-purple-50 border border-purple-200 rounded-xl p-5 shadow-sm space-y-3">
            <div class="flex items-center gap-2 text-purple-900 font-bold text-lg">
                <i class="fas fa-graduation-cap text-purple-600"></i>
                <h2 id="standard-title">Standard Tutorial Loading...</h2>
            </div>
            <div class="bg-white p-4 rounded-lg border border-purple-100 text-sm md:text-base leading-relaxed" id="standard-teaching"></div>
        </div>

        <!-- READ ALOUD CONTROLS WITH VOICE SELECTOR -->
        <div class="bg-white rounded-xl shadow-sm border p-4 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <button onclick="playTTS()" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 shadow-sm">
                    <i class="fas fa-volume-up"></i> Read Aloud
                </button>
                <button onclick="pauseTTS()" class="bg-slate-200 text-slate-700 px-3 py-2 rounded-lg"><i class="fas fa-pause"></i> Pause</button>
                <button onclick="stopTTS()" class="bg-slate-200 text-slate-700 px-3 py-2 rounded-lg"><i class="fas fa-stop"></i> Stop</button>
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <div class="flex items-center gap-2">
                    <label class="text-xs font-semibold text-slate-500 uppercase"><i class="fas fa-user-gear"></i> Voice:</label>
                    <select id="voice-select" onchange="stopTTS()" class="bg-slate-100 border rounded px-2 py-1 text-sm max-w-[200px] font-medium"></select>
                </div>
                <div class="flex items-center gap-2">
                    <label class="text-xs font-semibold text-slate-500 uppercase">Speed:</label>
                    <select id="speed-select" onchange="updateSpeed()" class="bg-slate-100 border rounded px-2 py-1 text-sm">
                        <option value="0.8">0.8x (Slow)</option>
                        <option value="1.0" selected>1.0x (Normal)</option>
                        <option value="1.2">1.2x (Fast)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- PASSAGE & QUESTION -->
        <div class="bg-white border rounded-xl shadow-sm p-6 space-y-6">
            <div>
                <span class="text-xs font-bold text-purple-600 uppercase tracking-wider block mb-1">Literary Passage / Poem</span>
                <div id="passage-text" class="bg-slate-50 p-4 rounded-lg border text-slate-800 font-serif leading-relaxed text-base whitespace-pre-line"></div>
            </div>
            <hr/>
            <div>
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">Question</span>
                <p id="question-text" class="text-slate-900 font-semibold text-lg mb-4"></p>
                <div id="options-container" class="space-y-3"></div>
            </div>
            <div id="feedback-box" class="hidden rounded-xl p-5"></div>
        </div>
    </main>

    <script>
        const standards = [
            {
                code: "ELA.6.R.1.1",
                title: "Character Interactions & Plot Development",
                teaching: "<b>TUTORIAL LESSON:</b> Character actions and dialogue act as the engine of the plot.<br/>• Pay attention to how one character's decision or encouragement shifts another character's actions to resolve a conflict.",
                passage: "As the storm raged, Leo wanted to turn back down the mountain. But Elena grabbed his sleeve, pointing to the ledge above. 'The shelter is fifty yards away, Leo! If we stop now, the freeze will catch us.' Leo took a deep breath, met her steady gaze, and nodded, pushing ahead against the howling wind.",
                question: "How does Elena's interaction with Leo drive the plot forward in this scene?",
                options: [
                    { text: "Her encouragement convinces Leo to overcome his fear and continue upward toward safety.", correct: true, explain: "Spot on! Elena's determination motivates Leo to push past his hesitation." },
                    { text: "Her panic causes Leo to give up and sit down in the snow.", correct: false, explain: "Incorrect. Elena remains focused and convinces Leo to keep moving." },
                    { text: "She forces Leo to hand over his climbing gear so she can go alone.", correct: false, explain: "Incorrect. They work together as a team to reach safety." },
                    { text: "She argues with Leo until the storm completely subsides.", correct: false, explain: "Incorrect. The storm continues raging; her intervention leads to immediate action." }
                ]
            },
            {
                code: "ELA.6.R.1.2",
                title: "Stated & Implied Theme Development",
                teaching: "<b>TUTORIAL LESSON:</b> A <b>Theme</b> is a universal life message.<br/>• <i>Tip:</i> Look at the major challenge a character faces and what lesson they learn by the end of the narrative.",
                passage: "For months, Mateo struggled to play the cello piece, missing notes and growing frustrated. Instead of quitting, he set a timer for twenty minutes every single afternoon. By the winter concert, his hands moved effortlessly across the strings, filling the hall with rich, flawless music.",
                question: "Which statement best expresses the implied theme of the passage?",
                options: [
                    { text: "Natural talent is more important than practice.", correct: false, explain: "Incorrect. Mateo struggled initially; his success was built through daily practice." },
                    { text: "Consistent effort and perseverance overcome initial difficulty.", correct: true, explain: "Excellent! Mateo's daily practice demonstrates that persistent effort leads to mastery." },
                    { text: "Performing in public is the only way to measure artistic success.", correct: false, explain: "Incorrect. The focus is on his journey of practice." },
                    { text: "Playing musical instruments is too stressful for young students.", correct: false, explain: "Incorrect. The resolution is triumphant." }
                ]
            },
            {
                code: "ELA.6.R.1.3",
                title: "Point of View & Perspective Shifts",
                teaching: "<b>TUTORIAL LESSON:</b><br/>• <b>Point of View:</b> Who is telling the story (1st Person 'I', 3rd Person 'He/She').<br/>• <b>Perspective:</b> How a narrator's feelings or background shape their opinion of an event.",
                passage: "Narrator A: 'I watched the ancient grandfather clock with awe, fascinated by its intricate brass gears and ticking rhythm.'\nNarrator B: 'To me, that loud, clanking wooden monster in the hallway was a constant nuisance that ruined every quiet evening.'",
                question: "How do Narrator A and Narrator B differ in their perspective of the clock?",
                options: [
                    { text: "Narrator A admires the craftsmanship, while Narrator B views it as an annoying disturbance.", correct: true, explain: "Correct! Narrator A feels awe, whereas Narrator B finds its noise irritating." },
                    { text: "Narrator A wants to sell the clock, while Narrator B wants to repair it.", correct: false, explain: "Incorrect. Selling or repairing is not mentioned." },
                    { text: "Both narrators agree that the clock should be removed from the house.", correct: false, explain: "Incorrect. Narrator A holds deep admiration for the clock." },
                    { text: "Narrator A is frightened by the clock, while Narrator B finds it calming.", correct: false, explain: "Incorrect. Narrator A feels awe, not fear." }
                ]
            },
            {
                code: "ELA.6.R.1.4",
                title: "Poetic Forms & Structure",
                teaching: "<b>TUTORIAL LESSON:</b> Analyze how poets build stanzas using rhyme schemes.<br/>• <b>AABB Scheme:</b> Line 1 rhymes with Line 2 (A), and Line 3 rhymes with Line 4 (B).",
                passage: "The golden sun begins to rise (A)\nAcross the quiet morning skies (A)\nIt warms the meadow down below (B)\nAnd makes the sleepy river glow (B)",
                question: "What structural rhyme scheme is used in this stanza?",
                options: [
                    { text: "ABAB scheme", correct: false, explain: "Incorrect. Lines 1-2 rhyme (rise/skies) and lines 3-4 rhyme (below/glow), which is AABB." },
                    { text: "AABB rhyming couplets", correct: true, explain: "Spot on! The AABB pattern creates harmonious pairs of rhyming lines." },
                    { text: "Free verse", correct: false, explain: "Incorrect. The lines have clear end rhymes." },
                    { text: "ABCB scheme", correct: false, explain: "Incorrect. The rhyme scheme is distinctly AABB." }
                ]
            }
        ];

        let currentIdx = 0;
        let answered = new Array(standards.length).fill(false);
        let score = 0;
        let synth = window.speechSynthesis;
        let availableVoices = [];

        function initVoices() {
            if(!('speechSynthesis' in window)) return;
            availableVoices = synth.getVoices();
            const voiceSelect = document.getElementById('voice-select');
            voiceSelect.innerHTML = '';

            let googleVoices = availableVoices.filter(v => v.name.includes("Google") || v.name.includes("Natural") || v.name.includes("Samantha"));
            let listToUse = googleVoices.length > 0 ? googleVoices : availableVoices;

            listToUse.forEach((v, i) => {
                const opt = document.createElement('option');
                opt.value = v.name;
                opt.innerText = v.name.replace('Google', 'Google Voice').replace('Microsoft', 'Natural');
                if (v.name.includes("Google US English") || v.name.includes("Natural") || (i === 0 && !voiceSelect.value)) {
                    opt.selected = true;
                }
                voiceSelect.appendChild(opt);
            });
        }

        if ('speechSynthesis' in window) {
            synth.onvoiceschanged = initVoices;
            initVoices();
        }

        function loadStandard(index) {
            currentIdx = index;
            const std = standards[index];
            document.querySelectorAll('.tab-btn').forEach((b, i) => i === index ? b.classList.add('tab-active') : b.classList.remove('tab-active'));
            document.getElementById('standard-title').innerText = `${std.code} - ${std.title}`;
            document.getElementById('standard-teaching').innerHTML = std.teaching;
            document.getElementById('passage-text').innerText = std.passage;
            document.getElementById('question-text').innerText = std.question;

            const optsContainer = document.getElementById('options-container');
            optsContainer.innerHTML = '';
            std.options.forEach((opt, oIdx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl border hover:border-purple-400 hover:bg-purple-50/50 transition flex items-start gap-3 font-medium";
                btn.onclick = () => selectOption(oIdx);
                btn.innerHTML = `<span class="bg-slate-100 border text-slate-600 rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold shrink-0 mt-0.5">${String.fromCharCode(65 + oIdx)}</span> <span>${opt.text}</span>`;
                optsContainer.appendChild(btn);
            });
            document.getElementById('feedback-box').className = "hidden rounded-xl p-5";
            stopTTS();
        }

        function selectOption(oIdx) {
            const std = standards[currentIdx];
            const selected = std.options[oIdx];
            const fbBox = document.getElementById('feedback-box');
            fbBox.className = "rounded-xl p-5";

            if(selected.correct) {
                fbBox.classList.add('bg-emerald-50', 'border', 'border-emerald-200', 'text-emerald-900');
                fbBox.innerHTML = `<div class="flex items-center gap-2 font-bold text-lg mb-1 text-emerald-800"><i class="fas fa-check-circle"></i> Excellent Work!</div><p>${selected.explain}</p>`;
                if(!answered[currentIdx]) { score++; answered[currentIdx] = true; document.getElementById('score-display').innerText = `${score} / ${standards.length}`; }
            } else {
                fbBox.classList.add('bg-rose-50', 'border', 'border-rose-200', 'text-rose-900');
                fbBox.innerHTML = `<div class="flex items-center gap-2 font-bold text-lg mb-1 text-rose-800"><i class="fas fa-exclamation-circle"></i> Corrective Re-Teaching</div><p>${selected.explain}</p>`;
            }
            speakText(selected.explain);
        }

        function switchStandard(idx) { loadStandard(idx); }

        function speakText(text) {
            stopTTS();
            if(!('speechSynthesis' in window)) return;
            const textToSpeak = text || `${standards[currentIdx].teaching.replace(/<[^>]*>/g, '')}. Passage: ${standards[currentIdx].passage}. Question: ${standards[currentIdx].question}`;
            const utt = new SpeechSynthesisUtterance(textToSpeak);
            utt.rate = parseFloat(document.getElementById('speed-select').value);
            
            const selectedVoiceName = document.getElementById('voice-select').value;
            const chosenVoice = availableVoices.find(v => v.name === selectedVoiceName);
            if(chosenVoice) utt.voice = chosenVoice;

            synth.speak(utt);
        }

        function playTTS() { speakText(); }
        function pauseTTS() { if(synth.speaking && !synth.paused) synth.pause(); else if(synth.paused) synth.resume(); }
        function stopTTS() { if(synth.speaking) synth.cancel(); }
        function updateSpeed() { if(synth.speaking) { stopTTS(); playTTS(); } }
        loadStandard(0);
    </script>
</body>
</html>
